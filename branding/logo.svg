<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img">
  <title>Jangsang</title>
  <desc>Jangsang CSS framework — logo caméléon, orange #FF6B00</desc>

  <!-- Arc externe 300° : de -120° à 180°, sens horaire, centre (110,110) R=100 -->
  <path d="M 60.0 23.4 A 100 100 0 1 1 10.0 110.0"
        fill="none" stroke="#FF6B00" stroke-width="6" stroke-linecap="butt"/>

  <!-- Arc intérieur épais 220° : de -155° à 65°, sens horaire, R=51 -->
  <path d="M 63.78 88.45 A 51 51 0 1 1 131.55 156.22"
        fill="none" stroke="#FF6B00" stroke-width="17" stroke-linecap="round"/>

  <!-- Arc intérieur fin 115° : de 80° à 195°, sens horaire, R=51 -->
  <path d="M 118.86 160.23 A 51 51 0 0 1 60.74 96.8"
        fill="none" stroke="#FF6B00" stroke-width="4.5" stroke-linecap="round" opacity="0.28"/>

  <!-- Caps extrémités arc externe -->
  <circle cx="60.0"  cy="23.4"  r="4.5" fill="#FF6B00"/>
  <circle cx="10.0"  cy="110.0" r="4.5" fill="#FF6B00"/>

  <!-- Centre — identité stable -->
  <circle cx="110" cy="110" r="6"  fill="#FF6B00"/>
  <circle cx="110" cy="110" r="19" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.3"/>
</svg>
